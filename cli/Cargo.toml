[package]
name = "stemgen-cli"
version = "0.5.0"
edition = "2024"

[[bin]]
doc = false
name = "stemgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.46", features = ["cargo", "derive"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
  "codec",
  "format",
  "software-resampling"
] }
glob = "0.3.3"
indicatif = "0.18.0"
libc = "0.2"

[dependencies.stemgen]
default-features = false
path = ".."

[features]
default = ["download-binaries"]
download-binaries = ["stemgen/download-binaries"]
cuda = ["stemgen/cuda"]
migraphx = ["stemgen/migraphx"]
webgpu = ["stemgen/webgpu"]
